<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title
      th:text="${produtoId == null ? 'Cadastrar produto' : 'Editar produto'}"
    >
      Cadastrar produto
    </title>
    <link rel="stylesheet" th:href="@{/style.css}" />
  </head>
  <body>
    <header
      th:replace="~{fragmentos :: cabecalho('produtos', ${produtoId == null ? 'Cadastrar produto' : 'Editar produto'})}"
    ></header>
    <main>
      <section>
        <form
          class="cadastro"
          method="post"
          th:object="${produtoForm}"
          th:action="${produtoId == null} ? @{/produtos} : @{/produtos/{id}(id=${produtoId})}"
        >
          <div class="erro" role="alert" th:if="${#fields.hasAnyErrors()}">
            <p>Revise os dados antes de salvar:</p>
            <ul>
              <li
                th:each="erro : ${#fields.allErrors()}"
                th:text="${erro}"
              ></li>
            </ul>
          </div>
          <div>
            <label for="nome">Nome *</label
            ><input
              id="nome"
              th:field="*{nome}"
              required
              maxlength="100"
              autofocus
            />
          </div>
          <div>
            <label for="descricao">Descrição</label
            ><textarea
              id="descricao"
              th:field="*{descricao}"
              maxlength="500"
              rows="3"
            ></textarea>
          </div>
          <div>
            <label for="preco">Preço (R$) *</label
            ><input
              id="preco"
              type="number"
              th:field="*{preco}"
              required
              min="0.01"
              max="9999999999.99"
              step="0.01"
            />
          </div>
          <div th:if="${produtoId == null}">
            <label for="quantidade">Estoque inicial *</label
            ><input
              id="quantidade"
              type="number"
              th:field="*{quantidade}"
              required
              min="0"
              max="2147483647"
              step="1"
            />
            <small
              >Com estoque 0 o produto nasce Esgotado. Depois, o saldo só muda
              pela tela de Estoque.</small
            >
          </div>
          <p th:if="${produtoId != null}">
            Saldo atual: <strong th:text="${saldoAtual}"></strong> un. Para
            alterar, registre uma entrada ou saída em
            <a th:href="@{/estoque}">Estoque</a>.
          </p>
          <p>* Campos obrigatórios.</p>
          <div class="acoes">
            <button type="submit">Salvar produto</button
            ><a th:href="@{/produtos}">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <footer th:replace="~{fragmentos :: rodape}"></footer>
  </body>
</html>
