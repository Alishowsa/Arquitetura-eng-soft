<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title
      th:text="${produtoId == null ? 'Cadastrar produto' : 'Editar produto'}"
    ></title>
    <link rel="stylesheet" th:href="@{/style.css}" />
  </head>
  <body>
    <header>
      <p>CADASTRO DE PRODUTOS</p>
      <h1
        th:text="${produtoId == null ? 'Cadastrar produto' : 'Editar produto'}"
      ></h1>
    </header>
    <main>
      <section>
        <form
          class="cadastro"
          method="post"
          th:object="${produtoForm}"
          th:action="${produtoId == null} ? @{/produtos} : @{/produtos/{id}(id=${produtoId})}"
        >
          <div class="erro" role="alert" th:if="${#fields.hasAnyErrors()}">
            <p>Revise os dados antes de salvar:</p>
            <ul>
              <li
                th:each="erro : ${#fields.allErrors()}"
                th:text="${erro}"
              ></li>
            </ul>
          </div>
          <div>
            <label for="nome">Nome *</label
            ><input
              id="nome"
              th:field="*{nome}"
              required
              maxlength="100"
              autofocus
            />
          </div>
          <div>
            <label for="descricao">Descrição</label
            ><textarea
              id="descricao"
              th:field="*{descricao}"
              maxlength="500"
              rows="3"
            ></textarea>
          </div>
          <div>
            <label for="preco">Preço (R$) *</label
            ><input
              id="preco"
              type="number"
              th:field="*{preco}"
              required
              min="0.01"
              max="9999999999.99"
              step="0.01"
            />
          </div>
          <div>
            <label for="quantidade">Quantidade em estoque *</label
            ><input
              id="quantidade"
              type="number"
              th:field="*{quantidade}"
              required
              min="0"
              max="2147483647"
              step="1"
            />
          </div>
          <p>* Campos obrigatórios.</p>
          <div class="acoes">
            <button type="submit">Salvar produto</button
            ><a th:href="@{/produtos}">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <footer>Cadastro de produtos · Spring MVC</footer>
  </body>
</html>
