spring.application.name=hub-faturamento
server.address=127.0.0.1
server.port=8090

spring.datasource.url=jdbc:h2:file:./data/hub
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

hub.filas.agendamento-ativo=true
hub.filas.intervalo-ms=2000

hub.emissor-nota.fora-do-ar=false
